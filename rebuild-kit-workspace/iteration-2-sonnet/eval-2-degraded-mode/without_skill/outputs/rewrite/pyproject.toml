[project]
name = "ticketd"
version = "0.1.0"
description = "ticketd rewrite: FastAPI + Postgres (see ../docs for rationale)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]
