[project]
name = "ticketd-rewrite"
version = "0.1.0"
description = "FastAPI + Postgres rewrite of legacy ticketd"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
migration = []  # migration script uses stdlib sqlite3 + the same sqlalchemy/psycopg

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
